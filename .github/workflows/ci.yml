name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python-quality:
    name: Python 3.12 quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run static checks
        run: ruff check app migrations main.py tests
      - name: Run automated tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q app migrations main.py tests
      - name: Check dependency consistency
        run: python -m pip check

  postgres-migration:
    name: PostgreSQL migration and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wms_gsp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wms_gsp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: development
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wms_gsp_test
      SECRET_KEY: ci-only-secret-key-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply reviewed migrations
        run: alembic upgrade head
      - name: Check model and migration consistency
        run: alembic check
      - name: Run tests against PostgreSQL
        run: pytest -q
